name: Terraform PR

on:
  pull_request:
    branches:
      - main

concurrency:
  group: terraform-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
    uses: melvyndekort/gha-workflows/.github/workflows/terraform-pr-validate.yml@v2

  plan:
    needs: validate
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: melvyndekort/gha-workflows/.github/workflows/terraform-pr-plan.yml@v2
    secrets:
      plan-role-arn: ${{ secrets.AWS_PLAN_ROLE_ARN }}
